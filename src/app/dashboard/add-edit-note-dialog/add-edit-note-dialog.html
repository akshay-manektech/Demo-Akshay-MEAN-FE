<div class="dialog-container">
  <h2 mat-dialog-title>Add New Note</h2>

  <form [formGroup]="noteForm" class="dialog-form">
    <!-- Title -->
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
      <mat-error *ngIf="noteForm.controls['title'].hasError('required')">
        Title is required
      </mat-error>
    </mat-form-field>

    <!-- Content -->
    <mat-form-field appearance="outline">
      <mat-label>Content</mat-label>
      <textarea
        matInput
        formControlName="content"
        rows="5"
        placeholder="Write your note here..."
      ></textarea>

      <mat-error *ngIf="noteForm.controls['content'].hasError('required')">
        Content is required
      </mat-error>
    </mat-form-field>
  </form>

  <div mat-dialog-actions align="end">
    <button mat-button (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" (click)="submit()" [disabled]="noteForm.invalid">
      Save
    </button>
  </div>
</div>
